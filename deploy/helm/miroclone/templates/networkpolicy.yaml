apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/part-of: miroclone }
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-egress-entra }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: api }
  policyTypes: [Egress]
  egress:
    {{- range .Values.egress.cidrs }}
    - to: [{ ipBlock: { cidr: {{ . | quote }} } }]
      ports: [{ port: 443 }]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-ingress-controller }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/part-of: miroclone }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{ toYaml .Values.ingressNamespaceLabels | nindent 14 }}
