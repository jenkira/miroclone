{{- $env := list
  (dict "name" "PORT" "value" (toString .Values.services.worker.port))
  (dict "name" "POSTGRES_HOST" "value" (required "Set postgres.host" .Values.postgres.host))
  (dict "name" "POSTGRES_DB" "value" .Values.postgres.database)
  (dict "name" "POSTGRES_SSL" "value" (ternary "1" "0" .Values.postgres.tls)) -}}
{{- if .Values.s3.bucket }}
{{- $env = append $env (dict "name" "S3_BUCKET" "value" .Values.s3.bucket) }}
{{- $env = append $env (dict "name" "S3_REGION" "value" .Values.s3.region) }}
{{- $env = append $env (dict "name" "S3_FORCE_PATH_STYLE" "value" (ternary "1" "0" .Values.s3.forcePathStyle)) }}
{{- with .Values.s3.endpoint }}{{ $env = append $env (dict "name" "S3_ENDPOINT" "value" .) }}{{ end }}
{{- end }}
{{- if .Values.smtp.host }}
{{- $env = append $env (dict "name" "SMTP_HOST" "value" .Values.smtp.host) }}
{{- $env = append $env (dict "name" "SMTP_PORT" "value" (toString .Values.smtp.port)) }}
{{- $env = append $env (dict "name" "SMTP_FROM" "value" (required "Set smtp.from" .Values.smtp.from)) }}
{{- $env = append $env (dict "name" "SMTP_TLS" "value" (ternary "1" "0" .Values.smtp.tls)) }}
{{- $env = append $env (dict "name" "APP_URL" "value" (printf "https://%s" (required "Set ingress.host" .Values.ingress.host))) }}
{{- end }}
{{- if .Values.tls.caConfigMap }}
{{- $env = append $env (dict "name" "NODE_EXTRA_CA_CERTS" "value" (printf "/etc/miroclone/ca/%s" .Values.tls.caKey)) }}
{{- end -}}
{{ include "miroclone.workload" (dict "root" $ "name" "worker" "svc" .Values.services.worker "env" $env "secret" true "caConfigMap" .Values.tls.caConfigMap "probePath" "/healthz") }}
