{{- range $name := list "api" "collab" }}
{{- $svc := index $.Values.services $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: miroclone }
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: miroclone }
    spec:
      {{- include "miroclone.podSecurity" $ | nindent 6 }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "miroclone.image" (dict "root" $ "svc" $svc) }}
          ports: [{ containerPort: {{ $svc.port }} }]
          env:
            - { name: PORT, value: "{{ $svc.port }}" }
            - { name: ENTRA_TENANT_ID, value: {{ $.Values.entra.tenantId | quote }} }
          envFrom:
            - secretRef: { name: {{ $name }}-secrets, optional: true }
          {{- if eq $name "api" }}
          startupProbe: { httpGet: { path: /healthz, port: {{ $svc.port }} }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: {{ $svc.port }} } }
          readinessProbe: { httpGet: { path: /readyz, port: {{ $svc.port }} } }
          {{- else }}
          startupProbe: { tcpSocket: { port: {{ $svc.port }} }, failureThreshold: 30, periodSeconds: 2 }
          livenessProbe: { tcpSocket: { port: {{ $svc.port }} } }
          readinessProbe: { tcpSocket: { port: {{ $svc.port }} } }
          {{- end }}
          {{- include "miroclone.containerSecurity" $ | nindent 10 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      {{- if eq $name "collab" }}
      terminationGracePeriodSeconds: 60
      {{- end }}
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }} }
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports: [{ port: {{ $svc.port }}, targetPort: {{ $svc.port }} }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ $name }} }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
{{- end }}
