{{- if .Values.externalSecrets.enabled }}
{{- range $name := list "api" "collab" "worker" }}
{{- $keys := index $.Values.externalSecrets $name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $.Values.externalSecrets.store.kind }}
    name: {{ $.Values.externalSecrets.store.name }}
  target:
    name: {{ $name }}-secrets
  data:
    {{- range $key, $id := $keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required (printf "Set externalSecrets.%s.%s to a Passwordstate password ID" $name $key) $id | quote }}
    {{- end }}
{{- end }}
{{- end }}
