{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miroclone
spec:
  parentRefs:
    {{- toYaml (required "Set gateway.parentRefs" .Values.gateway.parentRefs) | nindent 4 }}
  hostnames: [{{ required "Set ingress.host" .Values.ingress.host | quote }}]
  rules:
    {{- range $p, $svc := dict "/api" "api" "/auth" "api" }}
    - matches: [{ path: { type: PathPrefix, value: {{ $p }} } }]
      backendRefs: [{ name: {{ $svc }}, port: {{ $.Values.services.api.port }} }]
    {{- end }}
    # Gateway implementations set WebSocket idle timeouts and hashing in their own policy resources.
    - matches: [{ path: { type: PathPrefix, value: /collab } }]
      backendRefs: [{ name: collab, port: {{ .Values.services.collab.port }} }]
      timeouts: { request: 0s }
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: web, port: {{ .Values.services.web.port }} }]
{{- end }}
