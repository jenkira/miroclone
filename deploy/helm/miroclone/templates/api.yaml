{{- $env := list
  (dict "name" "PORT" "value" (toString .Values.services.api.port))
  (dict "name" "ENTRA_TENANT_ID" "value" (required "Set entra.tenantId" .Values.entra.tenantId))
  (dict "name" "ENTRA_CLIENT_ID" "value" (required "Set entra.clientId" .Values.entra.clientId))
  (dict "name" "ENTRA_REDIRECT_URI" "value" (required "Set entra.redirectUri" .Values.entra.redirectUri))
  (dict "name" "POSTGRES_HOST" "value" (required "Set postgres.host" .Values.postgres.host))
  (dict "name" "POSTGRES_DB" "value" .Values.postgres.database)
  (dict "name" "POSTGRES_SSL" "value" (ternary "1" "0" .Values.postgres.tls))
  (dict "name" "REDIS_HOST" "value" (required "Set redis.host" .Values.redis.host)) -}}
{{- if .Values.s3.bucket }}
{{- $env = append $env (dict "name" "S3_BUCKET" "value" .Values.s3.bucket) }}
{{- $env = append $env (dict "name" "S3_REGION" "value" .Values.s3.region) }}
{{- $env = append $env (dict "name" "S3_FORCE_PATH_STYLE" "value" (ternary "1" "0" .Values.s3.forcePathStyle)) }}
{{- with .Values.s3.endpoint }}{{ $env = append $env (dict "name" "S3_ENDPOINT" "value" .) }}{{ end }}
{{- end }}
{{- if .Values.clamd.host }}
{{- $env = append $env (dict "name" "CLAMD_HOST" "value" .Values.clamd.host) }}
{{- $env = append $env (dict "name" "CLAMD_PORT" "value" (toString .Values.clamd.port)) }}
{{- end }}
{{- $env = append $env (dict "name" "METRICS_PORT" "value" (toString .Values.monitoring.metricsPort)) }}
{{- if .Values.tracing.endpoint }}
{{- $env = append $env (dict "name" "OTEL_EXPORTER_OTLP_ENDPOINT" "value" .Values.tracing.endpoint) }}
{{- end }}
{{- if .Values.tls.caConfigMap }}
{{- $env = append $env (dict "name" "NODE_EXTRA_CA_CERTS" "value" (printf "/etc/miroclone/ca/%s" .Values.tls.caKey)) }}
{{- end -}}
{{ include "miroclone.workload" (dict "root" $ "name" "api" "svc" .Values.services.api "env" $env "secret" true "metrics" true "caConfigMap" .Values.tls.caConfigMap "probePath" "/healthz" "readyPath" "/readyz") }}
