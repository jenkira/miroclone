# Placeholder values so CI can lint and render the chart. Not for real installs.
entra: { tenantId: "00000000-0000-0000-0000-000000000000", clientId: "11111111-1111-1111-1111-111111111111", redirectUri: "https://board.example.internal/auth/callback" }
postgres: { host: "pg-rw.data.svc" }
redis: { host: "redis.data.svc" }
ingress: { host: "board.example.internal" }
networkPolicy:
  otlpTo: [{ podSelector: { matchLabels: { app: otel-collector } } }]
  entraEgressCidrs: ["10.0.0.0/24"]
  postgresTo: [{ podSelector: { matchLabels: { "cnpg.io/cluster": pg } } }]
  redisTo: [{ podSelector: { matchLabels: { app: redis } } }]
  smtpTo: [{ ipBlock: { cidr: "10.2.0.0/24" } }]
  s3To: [{ ipBlock: { cidr: "10.1.0.0/24" } }]
  clamdTo: [{ podSelector: { matchLabels: { app: clamav } } }]
smtp: { host: "smtp.example.internal", from: "miroclone@example.internal" }
s3: { endpoint: "https://s3.example.internal", bucket: boards }
clamd: { host: "clamav.security.svc" }
tls: { caConfigMap: internal-ca }
teams: { enabled: true }
externalSecrets:
  api: { S3_ACCESS_KEY_ID: "106", S3_SECRET_ACCESS_KEY: "107", ENTRA_CLIENT_SECRET: "101", SESSION_ENCRYPTION_KEY: "105", POSTGRES_USER: "102", POSTGRES_PASSWORD: "103", REDIS_PASSWORD: "104" }
  collab: { POSTGRES_USER: "102", POSTGRES_PASSWORD: "103", REDIS_PASSWORD: "104" }
  worker: { POSTGRES_USER: "102", POSTGRES_PASSWORD: "103", S3_ACCESS_KEY_ID: "106", S3_SECRET_ACCESS_KEY: "107", ENTRA_CLIENT_SECRET: "101" }
monitoring: { enabled: true }
tracing: { endpoint: "http://otel-collector.observability.svc:4318" }
